name: Release

# Tag the repository and this publishes a GitHub Release carrying the compiled
# portable build, so there is always a working download that does not depend on
# cheatengine.org being up.
#
#   git tag ci-7.5-001 && git push origin ci-7.5-001
#
# The build itself is delegated to build.yml, so a release artifact is byte-for-byte
# the product of the same steps that run on every push.

on:
  push:
    tags:
      - 'ci-*'
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for the release (e.g. ci-7.5-001)'
        type: string
        required: true
      prerelease:
        description: 'Mark the release as a pre-release'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - id: pick
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version='${{ inputs.version }}'
          else
            version='${{ github.ref_name }}'
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing as: $version"

  build:
    name: Build
    needs: resolve
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      # No --build-all: the runner is fresh, so there are no stale units to begin with,
      # and each build mode writes to its own UnitOutputDirectory (the AVX2 mode uses
      # lib\$(TargetCPU)-SSE4-AVX-$(TargetOS), the others lib\$(TargetCPU)-$(TargetOS)),
      # so targets cannot contaminate each other within a run either.

  publish:
    name: Publish release
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Download the build artifact
        uses: actions/download-artifact@v4
        with:
          name: cheat-engine-portable-${{ needs.resolve.outputs.version }}
          path: dist

      - name: Show what will be published
        run: ls -lh dist/

      - name: Compose the release notes
        id: notes
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "Unofficial community build of Cheat Engine, compiled by GitHub Actions from the source in this fork."
            echo
            echo "Built from commit \`${GITHUB_SHA}\` with Lazarus 2.2.2 / FPC 3.2.2 — the toolchain the upstream README specifies."
            echo
            echo "## Why this exists"
            echo
            echo "The download page on cheatengine.org has been serving an error for months, and the community mirror linked from its fallback page wraps the executable in a third-party installer signed by an unrelated publisher. This release is compiled straight from upstream source so there is a download whose provenance you can actually check."
            echo
            echo "## Read this before running it"
            echo
            echo "- **These binaries are unsigned.** No code-signing certificate is involved, so SmartScreen will warn you and some antivirus products will flag them. That is expected for an unsigned memory-scanning tool; it is not evidence the build is clean, and neither is this note — verify the checksums below and read the workflow logs if you want proof of how it was made."
            echo "- **No DBVM.** The kernel-level debugger driver needs a separate build and a self-signed driver, which this pipeline does not do. Memory scanning, pointer scanning, the disassembler and the Lua engine all work without it."
            echo "- **No Visual Studio components.** The .NET, Mono, Java (cejvmti) and tcc pieces come from .sln projects that this workflow does not build; the DLLs already committed to the repository are included as-is."
            echo "- This is not an official release and is not supported by the Cheat Engine developer. Report problems here, not on the upstream forum."
            echo
            echo "## Verifying the download"
            echo
            echo "With just the zip, in the folder you downloaded it to:"
            echo
            echo '```'
            echo "sha256sum -c --ignore-missing SHA256SUMS.txt"
            echo '```'
            echo
            echo "After extracting, run it from the folder that contains the extracted directory to check every executable as well:"
            echo
            echo '```'
            echo "sha256sum -c SHA256SUMS.txt"
            echo '```'
            echo
            echo "On Windows, \`certutil -hashfile <file> SHA256\` prints a hash you can compare by eye."
            echo
            echo "## Contents"
            echo
            echo "The archive extracts to a single \`CheatEngine-${VERSION}\` folder. \`Cheat Engine.exe\` inside it is the launcher; it picks the 32- or 64-bit build for you. Keep the folder together — the Lua scripts, language files and helper DLLs next to the executables are all required."
            echo
            echo "---"
            echo
            echo "Upstream project: <https://github.com/cheat-engine/cheat-engine> · original author: Eric Heijnen (Dark Byte)."
          } > release-notes.md
          cat release-notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          args=(
            "$VERSION"
            --title "Cheat Engine (community CI build $VERSION)"
            --notes-file release-notes.md
            --target "$GITHUB_SHA"
          )
          if [ "${PRERELEASE:-false}" = "true" ]; then
            args+=(--prerelease)
          fi
          # Recreate rather than fail when a tag is re-published deliberately.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; replacing its assets."
            gh release delete "$VERSION" --yes
          fi
          gh release create "${args[@]}" dist/*
